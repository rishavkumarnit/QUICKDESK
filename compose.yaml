services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: quickdesk
      POSTGRES_USER: quickdesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quickdesk -d quickdesk"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
